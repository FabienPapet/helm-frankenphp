# CI prerequisites for examples/11-secrets-volumes.yaml.
# The install-examples job applies any examples/setup/<example> file into the
# release namespace before `helm install`, so secret-backed examples can install.
---
apiVersion: v1
kind: Secret
metadata:
  name: symfony-secrets
type: Opaque
stringData:
  prod.decrypt.private.php: "dummy-decrypt-key-for-ci"
---
apiVersion: v1
kind: Secret
metadata:
  name: symfony-app-secrets
type: Opaque
stringData:
  app-secret: "dummy-app-secret-for-ci"
