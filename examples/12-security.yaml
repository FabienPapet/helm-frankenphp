# Example: Security-hardened deployment
# Demonstrates podSecurityContext, containerSecurityContext, and health probes.
# Note: FrankenPHP/Caddy may write to /tmp and /var — avoid readOnlyRootFilesystem: true
# unless your image is specifically built to handle it.
image:
  repository: dunglas/frankenphp
  tag: "1-php8.3"

deployment:
  replicas: 2

# FrankenPHP binds :80 and Caddy persists data under $XDG_DATA_HOME; running as a
# non-root user requires the NET_BIND_SERVICE capability and a writable data dir.
env:
  - name: SERVER_NAME
    value: ":80"
  - name: XDG_DATA_HOME
    value: /tmp
  - name: XDG_CONFIG_HOME
    value: /tmp

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  # Binding the privileged port 80 as a non-root user requires NET_BIND_SERVICE
  # to be effective, which in turn needs allowPrivilegeEscalation: true. If your
  # image serves on a port >= 1024 you can set this to false and drop the capability.
  allowPrivilegeEscalation: true
  runAsNonRoot: true
  runAsUser: 1000
  capabilities:
    drop:
      - ALL
    add:
      - NET_BIND_SERVICE

livenessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  failureThreshold: 3

resources:
  requests:
    cpu: "100m"
    memory: "128Mi"
  limits:
    memory: "256Mi"
