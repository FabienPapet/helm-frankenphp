# Secrets & Volume Mounts Example
#
# This example demonstrates how to inject a Kubernetes Secret as a file
# into your container — a common pattern for Symfony's decrypt private key
# (config/secrets/prod/prod.decrypt.private.php).
#
# Step 1: Create the Kubernetes Secret BEFORE installing/upgrading the chart.
#
#   kubectl create secret generic symfony-secrets \
#     --from-file=prod.decrypt.private.php=config/secrets/prod/prod.decrypt.private.php
#
# Or from a literal value (base64-encoded at rest by Kubernetes):
#
#   kubectl create secret generic symfony-secrets \
#     --from-literal=prod.decrypt.private.php="$(cat config/secrets/prod/prod.decrypt.private.php)"
#
# Step 2: Reference the secret in your values file (this file).

image:
  repository: my-registry/my-symfony-app
  tag: "1.0.0"

deployment:
  replicas: 2

env:
  - name: SERVER_NAME
    value: ":80"
  - name: APP_ENV
    value: prod
  - name: APP_SECRET
    valueFrom:
      secretKeyRef:
        name: symfony-app-secrets
        key: app-secret

# Mount the Symfony decrypt key from a pre-existing Kubernetes Secret.
volumes:
  - name: symfony-decrypt-key
    secret:
      secretName: symfony-secrets
      items:
        - key: prod.decrypt.private.php
          path: prod.decrypt.private.php

volumeMounts:
  - name: symfony-decrypt-key
    mountPath: /app/config/secrets/prod/prod.decrypt.private.php
    subPath: prod.decrypt.private.php
    readOnly: true
