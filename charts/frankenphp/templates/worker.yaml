{{- $context := . }}
{{- range .Values.consumers }}
{{- $workerName := printf "%s-%s-%s" $.Release.Name "worker" .name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $workerName }}
  labels:
    {{- include "helm-frankenphp.labels" $ | nindent 4 }}
spec:
{{- if not .autoscale }}
  replicas: {{ .replicas | default 1 }}
{{- end }}
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: {{ $workerName }}
  template:
    metadata:
      {{- with $.Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        app: {{ $workerName }}
    spec:
      {{- with $.Values.image.pullSecrets | default (list)}}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if $.Values.serviceAccount }}
      serviceAccountName: {{ include "helm-frankenphp.serviceAccountName" $ }}
      {{- end }}
      {{- with $.Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      restartPolicy: Always
      containers:
        - name: {{ $workerName }}
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag | default $.Chart.AppVersion }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy | default "IfNotPresent" }}
          {{- with $.Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          lifecycle:
            preStop:
              exec:
                command: [ "sh", "-c", "touch /tmp/kill_me" ]
          {{- with $.Values.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command: ["/bin/sh", "-c"]
          args:
            - {{ .command | quote }}
          {{- with $.Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $.Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $.Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if or $.Values.php.ini $.Values.volumeMounts }}
          volumeMounts:
            {{- if $.Values.php.ini }}
            - name: php-ini
              mountPath: /usr/local/etc/php/conf.d/99-custom.ini
              subPath: php.ini
            {{- end }}
            {{- with $.Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      {{- if or $.Values.php.ini $.Values.volumes }}
      volumes:
        {{- if $.Values.php.ini }}
        - name: php-ini
          configMap:
            name: {{ $.Release.Name }}-php-ini
        {{- end }}
        {{- with $.Values.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
{{- end }}
