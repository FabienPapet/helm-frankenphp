{{- if .Values.monitoring }}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ printf "%s-%s" .Release.Name .Chart.Name }}
  labels:
    {{- include "helm-frankenphp.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "helm-frankenphp.selectorLabels" . | nindent 6 }}
  podMetricsEndpoints:
    - port: metrics # nom du port dans le pod spec, ou utilise `targetPort` ci-dessous
      path: /metrics
      interval: 15s
      scheme: http
{{- end }}
