suite: Jobs
templates:
  - jobs.yaml
tests:
  - it: should not create jobs by default
    asserts:
      - hasDocuments:
          count: 0
  - it: should create a job with hook
    set:
      jobs:
        - name: migrate
          command: "php artisan migrate"
          annotations:
            "helm.sh/hook": pre-install
    asserts:
      - isKind:
          of: Job
      - matchRegex:
          path: metadata.name
          pattern: -job-migrate$
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install
      - equal:
          path: spec.template.spec.containers[0].args[0]
          value: "php artisan migrate"
  - it: should mount php.ini in jobs
    set:
      jobs:
        - name: test
          command: "cmd"
      php:
        ini: "conf"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].name
          value: php-ini
  - it: should default imagePullPolicy to IfNotPresent
    set:
      jobs:
        - name: test
          command: "cmd"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: IfNotPresent
  - it: should use global imagePullPolicy when set
    set:
      jobs:
        - name: test
          command: "cmd"
      image:
        pullPolicy: Always
    asserts:
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: Always
  - it: should set serviceAccountName when serviceAccount is configured
    set:
      jobs:
        - name: test
          command: "cmd"
      serviceAccount:
        create: true
        name: my-sa
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: my-sa
  - it: should not have serviceAccountName when serviceAccount is not set
    set:
      jobs:
        - name: test
          command: "cmd"
    asserts:
      - notExists:
          path: spec.template.spec.serviceAccountName
  - it: should not have resources if not set
    set:
      jobs:
        - name: test
          command: "cmd"
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].resources
  - it: should use global resources when set
    set:
      jobs:
        - name: test
          command: "cmd"
      resources:
        requests:
          cpu: "100m"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: "100m"
  - it: should use per-job resources override
    set:
      jobs:
        - name: test
          command: "cmd"
          resources:
            requests:
              cpu: "500m"
      resources:
        requests:
          cpu: "100m"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: "500m"
