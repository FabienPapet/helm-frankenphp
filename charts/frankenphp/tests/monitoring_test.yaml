suite: Monitoring
templates:
  - monitoring.yaml
tests:
  - it: should not create PodMonitor by default
    asserts:
      - hasDocuments:
          count: 0
  - it: should create PodMonitor when enabled
    set:
      monitoring: true
    asserts:
      - isKind:
          of: PodMonitor
      - isAPIVersion:
          of: monitoring.coreos.com/v1
  - it: should have a non-empty metadata name
    set:
      monitoring: true
    asserts:
      - matchRegex:
          path: metadata.name
          pattern: RELEASE-NAME
  - it: should have correct labels
    set:
      monitoring: true
    asserts:
      - exists:
          path: metadata.labels
  - it: should have correct endpoints
    set:
      monitoring: true
    asserts:
      - equal:
          path: spec.podMetricsEndpoints[0].port
          value: metrics
      - equal:
          path: spec.podMetricsEndpoints[0].path
          value: /metrics
