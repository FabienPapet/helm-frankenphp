suite: Deployment
templates:
  - crons.yaml
values:
  - ./values/_required.yaml
documentIndex: 0
set:
  crons:
    - name: "async-priority-autoscale"
      command: "php worker.php"
      schedule: "*/5 * * * *"
tests:
  - it: should be valid with defaults
    documentIndex: 0
    asserts:
      - isKind:
          of: CronJob
      - isAPIVersion:
          of: batch/v1
      - equal:
          path: spec.schedule
          value: "*/5 * * * *"
  - it: should have labels in metadata
    documentIndex: 0
    asserts:
      - exists:
          path: metadata.labels
  - it: should have resources if set
    documentIndex: 0
    set:
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
        limits:
          memory: "256Mi"
          cpu: "200m"
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].resources
          value:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              memory: "256Mi"
              cpu: "200m"
  - it: should have concurrencyPolicy if set
    documentIndex: 0
    set:
      crons:
        - name: "async-priority-autoscale"
          command: "php worker.php"
          schedule: "*/5 * * * *"
          concurrencyPolicy: "Forbid"
    asserts:
      - equal:
          path: spec.concurrencyPolicy
          value: "Forbid"
  - it: should not have concurrencyPolicy if not set
    documentIndex: 0
    asserts:
      - notExists:
          path: spec.concurrencyPolicy
  - it: should not have resources if not set
    documentIndex: 0
    asserts:
      - notExists:
          path: spec.jobTemplate.spec.template.spec.containers[0].resources
  - it: should default imagePullPolicy to IfNotPresent
    documentIndex: 0
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].imagePullPolicy
          value: IfNotPresent
  - it: should use global imagePullPolicy when set
    documentIndex: 0
    set:
      image:
        pullPolicy: Always
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].imagePullPolicy
          value: Always
  - it: should have imagePullSecrets if set
    documentIndex: 0
    set:
      image:
        pullSecrets:
          - name: mySecret
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.imagePullSecrets[0].name
          value: mySecret
  - it: should mount php.ini in cron
    documentIndex: 0
    set:
      php:
        ini: "memory_limit = 512M"
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].volumeMounts[0].name
          value: php-ini
      - equal:
          path: spec.jobTemplate.spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: /usr/local/etc/php/conf.d/99-custom.ini
      - equal:
          path: spec.jobTemplate.spec.template.spec.volumes[0].name
          value: php-ini
  - it: should set serviceAccountName when serviceAccount is configured
    documentIndex: 0
    set:
      serviceAccount:
        create: true
        name: my-sa
    asserts:
      - equal:
          path: spec.jobTemplate.spec.template.spec.serviceAccountName
          value: my-sa
