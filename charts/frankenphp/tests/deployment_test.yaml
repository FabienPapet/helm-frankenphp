suite: Deployment
templates:
  - deployment.yaml
tests:
  - it: should be a valid Deployment
    asserts:
      - isKind:
          of: Deployment
      - isAPIVersion:
          of: apps/v1
      - matchRegex:
          path: metadata.name
          pattern: RELEASE-NAME$
  - it: should have correct replicas
    set:
      deployment:
        replicas: 5
    asserts:
      - equal:
          path: spec.replicas
          value: 5
  - it: should have correct image
    set:
      image:
        repository: my-repo/image
        tag: "1.2.3"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].image
          value: "my-repo/image:1.2.3"
  - it: should have correct ports
    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports[0].containerPort
          value: 80
      - equal:
          path: spec.template.spec.containers[0].ports[1].containerPort
          value: 443
      - equal:
          path: spec.template.spec.containers[0].ports[2].containerPort
          value: 2019
  - it: should mount caddyfile volume if enabled
    set:
      caddyfile: "frankenphp"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].name
          value: caddyfile
      - equal:
          path: spec.template.spec.volumes[0].name
          value: caddyfile
  - it: should mount php.ini volume if enabled
    set:
      php:
        ini: "memory_limit = 512M"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].name
          value: php-ini
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: /usr/local/etc/php/conf.d/99-custom.ini
      - equal:
          path: spec.template.spec.volumes[0].name
          value: php-ini
  - it: should default imagePullPolicy to IfNotPresent
    asserts:
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: IfNotPresent
  - it: should use global imagePullPolicy when set
    set:
      image:
        pullPolicy: Always
    asserts:
      - equal:
          path: spec.template.spec.containers[0].imagePullPolicy
          value: Always
  - it: should have imagePullSecrets if set
    set:
      image:
        pullSecrets:
          - name: mySecret
    asserts:
      - equal:
          path: spec.template.spec.imagePullSecrets[0].name
          value: mySecret
  - it: should not have resources if not set
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].resources
  - it: should have resources if set
    set:
      resources:
        requests:
          cpu: "100m"
          memory: "128Mi"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: "100m"
  - it: should set serviceAccountName when serviceAccount is configured
    set:
      serviceAccount:
        create: true
        name: my-sa
    asserts:
      - equal:
          path: spec.template.spec.serviceAccountName
          value: my-sa
