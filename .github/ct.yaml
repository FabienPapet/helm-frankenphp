# chart-testing (ct) configuration. Docs: https://github.com/helm/chart-testing
target-branch: main
chart-dirs:
  - charts
helm-extra-args: --timeout 3m
check-version-increment: true
validate-maintainers: false
validate-chart-schema: true
# YAML style is covered by the dedicated `yamllint` CI step (examples/ + docs/)
# and `helm lint`; ct's built-in yamllint uses a stricter default that conflicts
# with the chart's existing comment style.
validate-yaml: false
